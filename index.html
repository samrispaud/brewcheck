<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1B5C" />
  <meta name="description" content="BrewCheck — Is your beer gluten-safe? Search 187 verified gluten test results." />
  <title>BrewCheck — Is your beer gluten-safe?</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="icon-master.png" type="image/png" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="icon-master.png" alt="" width="44" height="44" />
      <div class="brand-text">
        <h1>BrewCheck</h1>
        <p class="tagline">Is your beer gluten-safe?</p>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Search view -->
    <section id="view-search" class="view view--active" aria-label="Search beers">
      <div class="search-bar">
        <label class="visually-hidden" for="search-input">Search beers</label>
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            id="search-input"
            type="search"
            inputmode="search"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder='Try "corona" or "is blue moon gluten free?"'
          />
          <button id="clear-btn" class="clear-btn" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="mic-btn" class="mic-btn" type="button" aria-label="Search by voice" hidden>
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
              <path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p id="voice-status" class="voice-status" role="status" aria-live="polite" hidden></p>
      </div>

      <div id="results" class="results" aria-live="polite"></div>

      <div id="empty-state" class="empty-state">
        <p class="empty-state__lede">Search 187 beers tested for gluten.</p>
        <p class="empty-state__hint">Type a beer name above. Question phrasing is OK — try <em>"can I drink Corona?"</em></p>
      </div>
    </section>

    <!-- Detail view -->
    <section id="view-detail" class="view" aria-label="Beer details" hidden>
      <button id="back-btn" class="back-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <polyline points="15,5 8,12 15,19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <div id="detail-content"></div>
    </section>

    <!-- Loading -->
    <section id="view-loading" class="view view--loading" aria-label="Loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading beer database…</p>
    </section>

    <!-- Error -->
    <section id="view-error" class="view view--error" aria-label="Error" hidden>
      <h2>Couldn't load beer data</h2>
      <p id="error-message"></p>
      <button type="button" onclick="location.reload()">Reload</button>
    </section>
  </main>

  <footer class="app-footer">
    <p>Personal use · not medical advice · data from community gluten testing</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
